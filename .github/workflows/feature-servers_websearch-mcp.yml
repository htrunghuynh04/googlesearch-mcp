# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - websearch-mcp

on:
  push:
    branches:
      - feature/servers
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: npm install, build, and test
        run: |
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install
          npm run build --if-present
          npm run test --if-present

      - name: Install Playwright browsers for deployment
        run: |
          PLAYWRIGHT_BROWSERS_PATH=./playwright-browsers npx playwright install chromium

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E05D118EE15A42D6A64EED9249BBA487 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2FE83551C14047F9A0BE39C6FBC6A8F7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_04DFBDA9116244CCB84F7A099FF8E36E }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'websearch-mcp'
          slot-name: 'Production'
          package: .
          